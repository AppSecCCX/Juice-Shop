name: Dev Security Actions
on:
  push:
    branches:
    - dev

jobs:
  oast-snyk:
    runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@master
        - name: Run Snyk to check for vulnerabilities
          uses: snyk/actions/node@master
          env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          with:
            args: --severity-threshold=high
    # runs-on: ubuntu-latest
    # steps:
    # - uses: actions/checkout@master
    # - uses: snyk/actions/setup@master
    # - uses: actions/setup-node@v2
    #   with:
    #     node-version: "10.x"
    # - name: Run Snyk
    #   run: snyk test --json > snyk-results.json
    #   env:
    #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    #   continue-on-error: true
    # - uses: actions/upload-artifact@v4
    #   with:
    #     name: Snyk
    #     path: security_results/snyk-results.json
    #     args: --severity-threshold=high
      # if: always()

  secret_scanning-trufflehog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - run: docker run --rm -v $(pwd):/src hysnsec/trufflehog filesystem /src --json > trufflehog-output.json
      continue-on-error: true

    - uses: actions/upload-artifact@v4
      with:
        name: TruffleHog
        path: trufflehog-output.json
      if: always()

  sast-semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: docker run --rm -v "${PWD}:/src" returntocorp/semgrep semgrep --config auto --output semgrep-output.json --json
    - uses: actions/upload-artifact@v4
      with:
        name: semgrep
        path: semgrep-output.json
      if: always()

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
    - run: npm install
    - run: npm run build --if-present
    - uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: dist

  zap_baseline:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        ref: main

    - name: ZAP Scan
      uses: zaproxy/action-baseline@v0.4.0
      with:
        token: ${{ secrets.TOKEN }}
        docker_name: "softwaresecurityproject/zap-stable:2.14.0"
        target: ${{ secrets.PROD_URL }}
      continue-on-error: true
